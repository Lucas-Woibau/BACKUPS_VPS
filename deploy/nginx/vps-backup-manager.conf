# Nginx no HOST como reverse proxy HTTPS para o painel (que escuta em 127.0.0.1:8080).
# 1) apt install nginx certbot python3-certbot-nginx
# 2) copie para /etc/nginx/sites-available/ e ajuste server_name; ln -s em sites-enabled
# 3) certbot --nginx -d backup.seudominio.com.br
# 4) no .env: SESSION_COOKIE_SECURE=true e TRUST_PROXY_HEADERS=true; docker compose up -d
#
# Recomendado: restringir por IP (allow/deny) ou usar autenticação adicional (basic auth) / VPN.

limit_req_zone $binary_remote_addr zone=vbm_login:10m rate=10r/m;

server {
    listen 80;
    server_name backup.seudominio.com.br;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name backup.seudominio.com.br;

    # Gerenciado pelo certbot:
    ssl_certificate     /etc/letsencrypt/live/backup.seudominio.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/backup.seudominio.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 1m;

    # Opcional: liberar só seus IPs
    # allow 203.0.113.10;
    # deny all;

    location = /api/auth/login {
        limit_req zone=vbm_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
